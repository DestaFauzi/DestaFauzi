<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="border: 2px solid #333; border-radius: 8px;">
  <style>
    @keyframes fillProgress {
      0% { width: 0px; }
      5% { width: 0px; }
      10% { width: 100px; }
      16% { width: 220px; }
      23% { width: 350px; }
      30% { width: 440px; }
      35% { width: 492px; }
      92% { width: 492px; }
      100% { width: 0px; }
    }
    @keyframes pct0 { 0%, 9% { opacity: 1; } 10%, 100% { opacity: 0; } }
    @keyframes pct20 { 0%, 9% { opacity: 0; } 10%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes pct40 { 0%, 15% { opacity: 0; } 16%, 22% { opacity: 1; } 23%, 100% { opacity: 0; } }
    @keyframes pct60 { 0%, 22% { opacity: 0; } 23%, 29% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes pct80 { 0%, 29% { opacity: 0; } 30%, 34% { opacity: 1; } 35%, 100% { opacity: 0; } }
    @keyframes pct100 { 0%, 34% { opacity: 0; } 35%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }

    @keyframes textFade {
      0%, 34% { opacity: 0; transform: translateY(5px); }
      40%, 92% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; transform: translateY(-5px); }
    }

    .bg { fill: #181818; }
    .text-title { font-family: 'Courier New', Courier, monospace; font-size: 22px; font-weight: bold; fill: #A9FF1C; }
    .text-body { font-family: 'Courier New', Courier, monospace; font-size: 15px; fill: #FFFFFF; }
    .text-accent { font-family: 'Courier New', Courier, monospace; font-size: 16px; fill: #52BAFF; font-weight: bold; }
    
    .bar-fill {
      animation: fillProgress 6s infinite ease-in-out;
    }
    
    .p0 { animation: pct0 6s infinite; }
    .p20 { animation: pct20 6s infinite; }
    .p40 { animation: pct40 6s infinite; }
    .p60 { animation: pct60 6s infinite; }
    .p80 { animation: pct80 6s infinite; }
    .p100 { animation: pct100 6s infinite; }
    
    .spawn-info {
      animation: textFade 6s infinite ease-out;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Title -->
  <text x="30" y="55" class="text-title">⛏️ DestaFauzi.exe</text>

  <!-- Progress Bar Container -->
  <rect x="30" y="80" width="500" height="24" rx="4" fill="#252630" stroke="#3e4053" stroke-width="2" />
  
  <!-- Progress Bar Fill -->
  <rect x="34" y="84" height="16" rx="2" fill="#52BAFF" class="bar-fill" />

  <!-- Progress Percentages -->
  <g class="text-body">
    <text x="545" y="97" class="p0">[          ] Loading world... 0%</text>
    <text x="545" y="97" class="p20" style="opacity: 0;">[■■        ] Loading world... 20%</text>
    <text x="545" y="97" class="p40" style="opacity: 0;">[■■■■      ] Loading world... 40%</text>
    <text x="545" y="97" class="p60" style="opacity: 0;">[■■■■■■    ] Loading world... 60%</text>
    <text x="545" y="97" class="p80" style="opacity: 0;">[■■■■■■■■  ] Loading world... 80%</text>
    <text x="545" y="97" class="p100" style="opacity: 0;">[■■■■■■■■■■] Loaded world! 100%</text>
  </g>

  <!-- Spawn Info -->
  <g class="spawn-info">
    <text x="30" y="145" class="text-accent">System Analyst &amp; Full-Stack Developer</text>
    <text x="30" y="170" class="text-body" style="fill: #B0B0B0;">spawned at <tspan fill="#A9FF1C" font-weight="bold">Kodegiri</tspan> / <tspan fill="#A9FF1C" font-weight="bold">STAR Group</tspan></text>
  </g>
</svg>
